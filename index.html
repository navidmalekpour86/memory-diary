<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>خاطرات ما</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💛</text></svg>">
  <!-- Lets phones install it from "Add to Home Screen" and open it full-screen. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9636f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="خاطرات ما">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <!-- Libraries are bundled locally so the app does not depend on CDNs that may be filtered in Iran. -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/supabase.js"></script>
</head>
<body>
  <header id="top" hidden>
    <a href="#/" class="brand">💛 <span data-t="appName"></span></a>
    <!-- On phones this becomes a bottom tab bar (see styles.css). -->
    <nav>
      <a href="#/" data-nav="timeline"><span class="ic">📖</span><span data-t="timeline"></span></a>
      <a href="#/calendar" data-nav="calendar"><span class="ic">📅</span><span data-t="calendar"></span></a>
      <a href="#/map" data-nav="map"><span class="ic">🗺️</span><span data-t="map"></span></a>
      <a href="#/new" data-nav="new" class="nav-new"><span class="ic">➕</span><span data-t="newMemory"></span></a>
    </nav>
    <a href="#/new" class="btn primary" data-t="newMemory"></a>
    <button id="lang" class="link" data-t="switchTo"></button>
    <button id="signout" class="link" data-t="signOut"></button>
  </header>
  <main id="app"></main>
  <dialog id="viewer"><img alt=""><button class="close" aria-label="Close">✕</button></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
